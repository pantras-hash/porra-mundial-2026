name: Update results from football-data.org

on:
  workflow_dispatch:
    inputs:
      final_only:
        description: "Update only final scores, not live/running scores"
        required: false
        default: "false"
  schedule:
    - cron: "7-59/5 * * * *"

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: true

jobs:
  update-results:
    runs-on: ubuntu-latest

    steps:
      - name: Show trigger
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Current UTC time: $(date -u)"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update resultats.js from football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          FOOTBALL_DATA_COMPETITION: WC
          FOOTBALL_DATA_SEASON: "2026"
          FOOTBALL_DATA_DATE_FROM: "2026-06-11"
          FOOTBALL_DATA_DATE_TO: "2026-07-20"
          FOOTBALL_DATA_FINAL_ONLY: ${{ github.event.inputs.final_only || 'false' }}
        run: python scripts/update_results_from_football_data.py --resultats resultats.js

      - name: Commit updated resultats.js if changed
        run: |
          if git diff --quiet -- resultats.js; then
            echo "No result changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resultats.js
          git commit -m "Update World Cup results"

          git pull --rebase origin main
          git push
