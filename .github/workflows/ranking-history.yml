name: Regenerate ranking history

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - resultats.js
      - prediccions.js
      - monte_carlo_data.json
      - scripts/generate_ranking_history.py

permissions:
  contents: write

concurrency:
  group: ranking-history
  cancel-in-progress: true

jobs:
  regenerate-ranking-history:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate ranking history
        run: python scripts/generate_ranking_history.py --data monte_carlo_data.json --resultats resultats.js --out-dir .

      - name: Commit ranking history if changed
        run: |
          if git diff --quiet -- ranking_history_latest.js ranking_history/; then
            echo "No ranking history changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking_history_latest.js ranking_history/
          git commit -m "Update ranking history"

          git pull --rebase origin main
          git push
